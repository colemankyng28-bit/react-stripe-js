name: Bug Report
description: File a bug report relating to the React Stripe.js wrapper library.
title: '[BUG]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! This project is a thin wrapper around [Stripe.js](https://stripe.com/docs/js). Please only file issues here that you believe represent bugs with the wrapper, not Stripe.js itself.

        If you're having general trouble with Stripe.js or your Stripe integration, please reach out to us using the form at https://support.stripe.com/email or come chat with us on the [Stripe Discord](https://discord.com/invite/stripe) server. We're very proud of our level of service, and we're more than happy to help you out with your integration.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description:
        Please include a concise summary of the problem and what you were trying to accomplish.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description:
        What did you expect to happen instead of the current behavior?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description:
        What happened instead? Please include any error messages, console output, or relevant symptoms.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description:
        Please include a minimal reproduction, steps to reproduce, or a link to a runnable example such as a Glitch or CodeSandbox project.
      placeholder: https://glitch.com/edit/#!/your-project
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description:
        What browser and operating system are you seeing this issue on? What versions of React, Stripe.js, and this package are involved?
      placeholder: Chrome 99.0.4844.51 on macOS 12.2.1; React 18.2.0; @stripe/react-stripe-js 2.1.0
    validations:
      required: true
